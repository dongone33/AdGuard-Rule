name: Update Filters
on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
    branches: [ main ]
  schedule:
    - cron: 0 */12 * * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

concurrency:
  group: update-filters-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Setup SmartDNS
        run: |
          set -e
          mkdir -p /tmp/smartdns
          wget -q https://github.com/pymumu/smartdns/releases/latest/download/smartdns-x86_64 -O /tmp/smartdns/smartdns
          chmod +x /tmp/smartdns/smartdns
          cp smartdns/smartdns.conf /tmp/smartdns/smartdns.conf
          nohup /tmp/smartdns/smartdns -f -x -c /tmp/smartdns/smartdns.conf > /dev/null 2>&1 &

      - name: Wait for SmartDNS
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c "echo > /dev/udp/127.0.0.1/5053" 2>/dev/null; then
              echo "SmartDNS port is open"
              break
            fi
            echo "waiting for smartdns... ($i)"
            sleep 2
          done

      - name: Run Jar
        run:  java -jar ./target/adg-rule-1.0.0.jar

      - name: Commit Changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- rule/*.txt)" ]; then
              exit 0
          else
            echo "status=success" >> $GITHUB_OUTPUT
            git add -- rule/*.txt
            git config --local user.name "actions"
            git config --local user.email "action@github.com"
            git commit -m "CI Updated at $(date +'%Y-%m-%d %H:%M:%S')" -- rule/*.txt
          fi

      - name: Push rule updates
        if: steps.commit.outputs.status == 'success' && !cancelled()
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Mirror Refresh
        run: sleep 10 && curl 'https://purge.jsdelivr.net/gh/${{github.repository}}/rule'


      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 2
